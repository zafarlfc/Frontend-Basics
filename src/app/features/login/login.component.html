<div class="auth-wrapper">
    <div class="login-card">
        <div class="auth-header">
            <div class="logo">A</div>
            <h2>Log in to your account</h2>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="e.g. name@company.com" formControlName="email"
                    [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid" />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter password" formControlName="password"
                    [class.is-invalid]="form.get('password')?.touched && form.get('password')?.invalid" />
            </div>

            <button type="submit" class="btn-primary" [disabled]="form.invalid">
                Continue
            </button>
        </form>

        <div class="auth-footer">
            <a routerLink="/forgot">Can't log in?</a>
            <span class="dot">•</span>
            <a routerLink="/register">Sign up for an account</a>
        </div>
    </div>
</div>
